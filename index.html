<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>First anniversary</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="album" id="album">
    <audio id="bgm" src="music/bgm.mp3" loop preload="auto"></audio>

    <button class="music-btn" id="musicBtn" type="button" aria-label="播放或暂停音乐">♫</button>

    <section class="intro" id="intro">
      <div class="intro-card">
        <div class="heart">♥</div>
        <h1>我们的回忆</h1>
        <p>轻触屏幕开始</p>
      </div>
    </section>

    <div class="slider" id="slider" aria-label="照片相册">
      <figure class="slide"><img src="images/01.jpg" alt="照片 1"><figcaption>1 / 11</figcaption></figure>
      <figure class="slide"><img src="images/02.jpg" alt="照片 2"><figcaption>2 / 11</figcaption></figure>
      <figure class="slide"><img src="images/03.jpg" alt="照片 3"><figcaption>3 / 11</figcaption></figure>
      <figure class="slide"><img src="images/04.jpg" alt="照片 4"><figcaption>4 / 11</figcaption></figure>
      <figure class="slide"><img src="images/05.jpg" alt="照片 5"><figcaption>5 / 11</figcaption></figure>
      <figure class="slide"><img src="images/06.jpg" alt="照片 6"><figcaption>6 / 11</figcaption></figure>
      <figure class="slide"><img src="images/07.jpg" alt="照片 7"><figcaption>7 / 11</figcaption></figure>
      <figure class="slide"><img src="images/08.jpg" alt="照片 8"><figcaption>8 / 11</figcaption></figure>
      <figure class="slide"><img src="images/09.jpg" alt="照片 9"><figcaption>9 / 11</figcaption></figure>
      <figure class="slide"><img src="images/10.jpg" alt="照片 10"><figcaption>10 / 11</figcaption></figure>
      <figure class="slide"><img src="images/11.jpg" alt="照片 11"><figcaption>11 / 11</figcaption></figure>
    </div>

    <div class="dots" id="dots" aria-hidden="true"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
